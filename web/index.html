<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e0b">
  <title>SloppyTyper — claim your keystrokes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="SloppyTyper home"><span class="brand-mark">s<span>▌</span></span>sloppy<span>typer</span><small>v0.1</small></a>
      <div class="local-status"><span class="status-dot"></span> LOCAL SESSION</div>
    </header>

    <main class="workspace">
      <section class="terminal" aria-label="Source code replay">
        <div class="terminal-bar"><div class="terminal-dots" aria-hidden="true"><i></i><i></i><i></i></div><select id="files" aria-label="Source file"><option>Loading source</option></select><span id="file-kind" class="file-kind">MODIFIED</span></div>
        <div class="code-meta"><span><span class="status-dot"></span> <span id="phase">READY</span></span><span id="file-progress">0 / 0 CHARACTERS</span><button id="skip">Skip file ↗</button></div>
        <div class="code-stage"><div id="code-scroll" class="code-scroll" tabindex="0" aria-label="Code preview. Press letter keys to replay changes."><pre id="code" aria-hidden="true"></pre><p id="empty-code" hidden>New file. Press any key to begin.</p></div><canvas id="code-effects" aria-hidden="true"></canvas></div>
        <div id="completion" class="completion" hidden>
          <div class="completion-icon">✓</div><h2>Replay complete.</h2><div class="completion-stats"><span><strong id="end-keys">0</strong>KEYSTROKES</span><span><strong id="end-time">0s</strong>ELAPSED</span><span><strong id="end-files">0</strong>FILES</span></div><button id="again" class="primary-button">↻ &nbsp; Replay again</button>
        </div>
      </section>
    </main>

    <section class="control-deck" aria-label="Replay controls">
      <button id="mash" class="mash-button"><span class="keycap">⌨</span><strong id="mash-title">MASH ANY KEY</strong><span class="mash-arrow">↵</span></button>
      <div class="speed-control"><span class="muted-label">CHARS / KEY</span><div role="group" aria-label="Characters per keystroke"><button data-speed="1" aria-pressed="true">1</button><button data-speed="5" aria-pressed="false">5</button><button data-speed="10" aria-pressed="false">10</button><button data-speed="20" aria-pressed="false">20</button><button data-speed="50" aria-pressed="false">50</button></div></div>
      <div class="extra-controls"><button id="sound" aria-pressed="false" title="Toggle synthesized keyboard sound">♪ <span>Sound off</span></button><button id="reset" title="Restart all files">↺ <span>Restart</span></button></div>
    </section>

    <section class="progress-section" aria-label="Overall replay progress"><div class="progress-copy"><span><strong id="percent">0%</strong> <span>REPLAYED</span><span id="skipped"></span></span><span><b id="keys">0</b> KEYSTROKES <span class="divider">/</span> <b id="completed-files">0 / 0</b> FILES</span></div><progress id="progress" value="0" max="100" aria-label="Changes replayed">0%</progress></section>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
    <div id="error" class="error" role="alert" hidden></div>
  </div>
</body>
</html>
